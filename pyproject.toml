# Registers the `sdt` command (Structural Design Toolkit) for main.py:
#   pip install -e .   then   sdt wind / sdt setup / sdt --help   (`xs` is kept as an alias)
# Dependencies stay in requirements.txt (pip install -r requirements.txt).
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "structural-design-toolkit"
version = "0.1.0"
description = "Structural design checks and ETABS workflows"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
sdt = "main:main"
xs = "main:main"  # earlier name of the command

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["design*", "etabs_api*", "utilities*"]
