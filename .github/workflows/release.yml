name: Release

# Push a tag such as v1.0.0 to publish a GitHub Release.
# "Run workflow" (manual) builds the same package as a downloadable artifact only.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    name: Build release package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Zip of the committed Python source and docs (git archive skips caches and ignored files).
      - name: Package the source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $wanted = 'main.py', 'pyproject.toml', 'requirements.txt', 'README.md', 'design', 'etabs_api', 'utilities', 'doc'
          $paths = $wanted | Where-Object { git ls-files -- $_ }
          git archive --format=zip --output "dist/structural-toolkit-${{ github.ref_name }}.zip" HEAD @paths
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Standalone geotech tool (same build as geotech/build_exe.bat). Skipped if the script is not committed.
      - name: Build LogSpiralPassive.exe
        if: hashFiles('geotech/logspiral_passive.py') != ''
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          python -m PyInstaller --onefile --console --clean --name LogSpiralPassive `
            --distpath dist --workpath build/pyinstaller --specpath build geotech/logspiral_passive.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | ForEach-Object { $_.FullName }
          gh release create "${{ github.ref_name }}" @files --title "${{ github.ref_name }}" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
